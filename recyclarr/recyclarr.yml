# Recyclarr — syncs TRaSH Guides quality definitions to Sonarr/Radarr
# quality_definition sets min/preferred/max sizes per quality from TRaSH Guides
# Runs daily via CRON_SCHEDULE env var in docker-compose.yml

sonarr:
  main:
    base_url: http://sonarr:8989
    api_key: !env_var SONARR_API_KEY
    quality_definition:
      type: series

radarr:
  main:
    base_url: http://radarr:7878
    api_key: !env_var RADARR_API_KEY
    quality_definition:
      type: movie

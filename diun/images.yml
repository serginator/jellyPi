# Diun image list: notify only when a NEW VERSION is published, not on rebuilds.
#
# Every service uses :latest (or a floating major), and watching that tag by
# digest fires on every rebuild (base-image bumps, "add krb5-libs", ...). So
# instead each entry watches the repo's tags (watch_repo) filtered to release
# tags with include_tags, and notifies only for tags it has never seen
# (notify_on: new). Pre-release tags (unstable, nightly, beta, rc...) are excluded.
# Diun only skips notifying on its very first scan when its DB is EMPTY. With an
# existing DB, a new entry queues every matching tag, so update-containers.py
# drops any burst above FLOOD_LIMIT tags instead of asking about each one.
#
# - lscr.io/linuxserver/*: `version-<app version>` is the per-release tag. The
#   `<version>-lsNNN` tags change on every rebuild, so they are not matched.
# - Docker Hub images: max_tags + sort_tags semver bound the work. Diun GETs one
#   manifest per tag and Docker Hub allows ~100 anonymous pulls per 6 hours.
# - ghcr.io images have no such limit, so all matching tags are watched.
#
# Adding a service: add an entry here (it is NOT auto-discovered from compose).
# Diun re-reads this file on every scan, no restart needed.

# --- linuxserver (ghcr-backed) ---
- name: lscr.io/linuxserver/jellyfin:latest
  watch_repo: true
  notify_on: [new]
  include_tags: ['^version-v?\d+\.\d+']
  exclude_tags: ['unstable', 'nightly', 'alpha', 'beta', 'preview', 'develop', '-rc']

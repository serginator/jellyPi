# --- Docker Hub (bounded) ---
# gluetun: `latest` tracks master; notify only for tagged releases.
- name: docker.io/qmcgaw/gluetun:latest
  watch_repo: true
  notify_on: [new]
  sort_tags: semver
  max_tags: 3
  include_tags: ['^v\d+\.\d+\.\d+$']
  exclude_tags: ['unstable', 'nightly', 'alpha', 'beta', 'preview', 'develop', '-rc']

services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${STORAGE}/config/jellyfin:/config
      - ${STORAGE}/data/media:/data/media
    devices:
      # V4L2 hardware acceleration on Pi 4 — remove if not available
      - /dev/video10:/dev/video10
      - /dev/video11:/dev/video11
      - /dev/video12:/dev/video12
    ports:
      - 8096:8096
    restart: unless-stopped
    networks:
      - media

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${STORAGE}/config/sonarr:/config
      # Full /data mount is required for hardlinks to work
      - ${STORAGE}/data:/data
    ports:
      - 8989:8989
    restart: unless-stopped
    networks:
      - media

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${STORAGE}/config/radarr:/config
      - ${STORAGE}/data:/data
    ports:
      - 7878:7878
    restart: unless-stopped
    networks:
      - media

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${STORAGE}/config/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped
    networks:
      - media

  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=private internet access
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${PIA_USER}
      - OPENVPN_PASSWORD=${PIA_PASSWORD}
      - SERVER_REGIONS=${PIA_SERVER_REGION:-Spain}
      - FIREWALL_INPUT_PORTS=8080
    volumes:
      - ${STORAGE}/config/gluetun:/gluetun
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped
    networks:
      - media

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - ${STORAGE}/config/qbittorrent:/config
      - ${STORAGE}/data/torrents:/data/torrents
    network_mode: service:gluetun
    depends_on:
      - gluetun
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${STORAGE}/config/bazarr:/config
      - ${STORAGE}/data/media:/data/media
    ports:
      - 6767:6767
    restart: unless-stopped
    networks:
      - media

  seerr:
    image: seerr/seerr:latest
    container_name: seerr
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - TZ=${TZ}
    volumes:
      - ${STORAGE}/config/seerr:/app/config
    ports:
      - 5055:5055
    restart: unless-stopped
    networks:
      - media

  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    volumes:
      - ${STORAGE}/config/uptime-kuma:/app/data
    ports:
      - 3001:3001
    restart: unless-stopped
    networks:
      - media

  unpackerr:
    image: golift/unpackerr:latest
    container_name: unpackerr
    environment:
      - TZ=${TZ}
      - UN_SONARR_0_URL=http://sonarr:8989
      - UN_SONARR_0_API_KEY=${SONARR_API_KEY}
      - UN_RADARR_0_URL=http://radarr:7878
      - UN_RADARR_0_API_KEY=${RADARR_API_KEY}
    volumes:
      - ${STORAGE}/data/torrents:/data/torrents
    restart: unless-stopped
    networks:
      - media

  decluttarr:
    image: ghcr.io/manimatter/decluttarr:latest
    container_name: decluttarr
    environment:
      - TZ=${TZ}
      - QBITTORRENT_URL=http://gluetun:8080
      - QBITTORRENT_USERNAME=admin
      - QBITTORRENT_PASSWORD=${QBITTORRENT_PASSWORD}
      - SONARR_URL=http://sonarr:8989
      - SONARR_KEY=${SONARR_API_KEY}
      - RADARR_URL=http://radarr:7878
      - RADARR_KEY=${RADARR_API_KEY}
      - REMOVE_STALLED=true
      - REMOVE_SLOW=false
      - PERMITTED_ATTEMPTS=3
    restart: unless-stopped
    networks:
      - media

  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: jellypi
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - ${STORAGE}/config/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    network_mode: host
    restart: unless-stopped

networks:
  media:
    driver: bridge
